<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#2563eb">

  <title>PronounceTech - B.Tech Speaking Coach</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="topbar">

    <div class="brand">

      <div class="logo">
        PT
      </div>

      <div>
        <h1>PronounceTech</h1>
        <p>B.Tech Speaking Coach</p>
      </div>

    </div>

    <button id="themeBtn" class="icon-btn">
      ☀️
    </button>

  </header>


  <!-- MAIN CONTENT -->
  <main class="container">


    <!-- HERO -->
    <section class="hero">

      <span class="pill">
        🎓 Built for B.Tech Students
      </span>

      <h2>
        Speak. Practice. Improve.
      </h2>

      <p>
        Choose your own topic, speak naturally,
        and get an instant speaking review.
      </p>

    </section>



    <!-- TOPIC SETUP -->
    <section class="card" id="setupCard">

      <div class="section-title">

        <div>

          <h3>
            1. Choose your topic
          </h3>

          <p>
            Speak about your studies, career,
            technology or any topic you like.
          </p>

        </div>

      </div>


      <label for="topic">
        Your topic
      </label>

      <input
        id="topic"
        type="text"
        maxlength="100"
        placeholder="e.g. Artificial Intelligence in Education"
      >


      <!-- TOPIC SUGGESTIONS -->

      <div class="suggestions">

        <button class="suggestion">
          Artificial Intelligence
        </button>

        <button class="suggestion">
          My B.Tech Journey
        </button>

        <button class="suggestion">
          Technology in Education
        </button>

        <button class="suggestion">
          Future of Software Engineering
        </button>

      </div>


      <!-- DURATION -->

      <label for="duration">
        Speaking time
      </label>

      <select id="duration">

        <option value="60">
          1 minute
        </option>

        <option value="120" selected>
          2 minutes
        </option>

          3 minutes
